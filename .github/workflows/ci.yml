name: CI

# When to run: every push to master, and pull requests targeting master
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  hello:
    install:
      - name: install dependencies
        runs-on: ubuntu-latest
        steps:
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: setup Node.js
            uses: actions/setup-node@v4
            with:
              node-version-file: '.nvmrc'
              cache: 'npm'

          - name: install dependencies
            run: npm ci