<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Management CRUD</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>User Management</h1>
      <p>Simple Node.js + Express + MySQL CRUD</p>
    </header>

    <section class="form-card">
      <h2 id="form-title">Add User</h2>
      <form id="user-form">
        <input type="hidden" id="user-id" />

        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Full name" required minlength="2" />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="name@example.com" required />
        </div>

        <div class="field">
          <label for="phone">Phone</label>
          <input type="text" id="phone" placeholder="e.g. 9876543210" required />
        </div>

        <div class="actions">
          <button type="submit" id="submit-btn" class="btn primary">Add User</button>
          <button type="button" id="cancel-btn" class="btn secondary hidden">Cancel</button>
        </div>
      </form>
      <p id="message" class="message" role="status"></p>
    </section>

    <section class="table-card">
      <div class="table-header">
        <h2>Users</h2>
        <button type="button" id="refresh-btn" class="btn secondary">Refresh</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Created</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-body">
            <tr>
              <td colspan="6" class="empty">Loading users...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
